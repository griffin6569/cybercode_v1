# CyberCodeMini Azure ML Environment
name: cybercodemini
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - torch>=2.1.0
    - transformers>=4.38.0
    - datasets>=2.16.0
    - accelerate>=0.26.0
    - peft>=0.8.0
    - trl>=0.7.0
    - bitsandbytes>=0.41.0
    - sentencepiece>=0.1.99
    - safetensors>=0.4.0
    - pyyaml>=6.0
    - pydantic>=2.5.0
    - jsonlines>=4.0.0
    - huggingface_hub>=0.20.0
