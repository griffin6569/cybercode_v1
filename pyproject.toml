[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cybercodemini"
version = "0.1.0"
description = "A small, specialized coding + cybersecurity + agentic AI model"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "CyberCodeMini Contributors"}
]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "datasets>=2.16.0",
    "accelerate>=0.26.0",
    "peft>=0.8.0",
    "trl>=0.7.0",
    "sentencepiece>=0.1.99",
    "safetensors>=0.4.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "jsonlines>=4.0.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
azure = [
    "azureml-core>=1.50.0",
    "azure-ai-ml>=1.12.0",
]
quantization = [
    "bitsandbytes>=0.41.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
